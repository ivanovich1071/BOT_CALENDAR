{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">{{ page_title }}</h1>

<form method="post" action="/admin/knowledge/save" class="bg-white rounded-xl shadow p-6 space-y-4 text-sm max-w-4xl">
  <input type="hidden" name="article_id" value="{{ article.id if article else 0 }}">
  <div class="grid grid-cols-1 md:grid-cols-6 gap-4">
    <label class="block md:col-span-5"><span class="text-slate-600">Заголовок *</span>
      <input name="title" required maxlength="200" value="{{ article.title if article else '' }}"
             class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2"></label>
    <label class="block"><span class="text-slate-600">Порядок</span>
      <input name="sort_order" type="number" value="{{ article.sort_order if article else next_order }}"
             class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2"></label>
  </div>
  <label class="block"><span class="text-slate-600">Текст</span>
    <textarea name="body" rows="22" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 font-mono text-xs leading-5">{{ article.body if article else '' }}</textarea>
    <span class="text-xs text-slate-500">Можно markdown: **жирный**, списки через «-». Пишите фактами — консультант цитирует их клиентам.</span>
  </label>
  <label class="flex items-center gap-2">
    <input type="checkbox" name="is_active" {{ 'checked' if not article or article.is_active }} class="rounded"> Использовать в ответах
  </label>
  <div class="flex gap-3">
    <button class="bg-slate-900 text-white px-5 py-2 rounded-lg hover:bg-slate-700">Сохранить</button>
    <a href="/admin/knowledge" class="px-5 py-2 rounded-lg border border-slate-300 hover:bg-slate-50">Отмена</a>
  </div>
</form>
{% endblock %}
